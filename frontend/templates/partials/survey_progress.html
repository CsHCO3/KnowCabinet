<div>
  <div class="card mb-3">
    <div class="card-body">
      <h6>📊 进度</h6>
      <div class="progress progress-htx mb-2">
        {% set pct = survey.progress.percent if survey.progress else 0 %}
        <div class="progress-bar progress-bar-striped progress-bar-animated"
             style="width: {{ pct }}%">
          {{ pct }}%
        </div>
      </div>
      <p class="mb-0 small text-muted">{{ survey.progress.current_step if survey.progress else "等待中..." }}</p>
      {% if survey.status == "running" %}
        <!-- 轮询用 innerHTML 替换整个结果区，避免把进度卡片插进自己导致层层嵌套 -->
        <div hx-get="/api/surveys/{{ survey.task_id }}/progress"
             hx-trigger="every 3s" hx-target="#survey-result" hx-swap="innerHTML">
        </div>
      {% endif %}
      {% if survey.status == "completed" %}
        <div hx-get="/api/surveys/{{ survey.task_id }}"
             hx-trigger="load" hx-target="#survey-result" hx-swap="innerHTML">
        </div>
      {% endif %}
    </div>
  </div>
</div>
