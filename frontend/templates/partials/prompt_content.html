<div class="card">
  <div class="card-header d-flex justify-content-between">
    <strong>{{ content.filename }}</strong>
    <small class="text-muted">{{ content.path }}</small>
  </div>
  <div class="card-body">
    <pre class="mb-0" style="max-height: 500px; overflow-y: auto; background: #f8f9fa; padding: 1rem; border-radius: .25rem; font-size: .85rem;">{{ content.content }}</pre>
  </div>
</div>
